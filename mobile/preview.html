<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BATYEO · Mobile preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e7ece5;color:#19382c;font-family:system-ui,-apple-system,sans-serif}.phone{width:min(100%,430px);min-height:100vh;margin:auto;background:#19382c;padding:28px;display:flex;flex-direction:column;gap:24px}.brand{color:#f4f6ee;font-size:30px;font-weight:800}.dot,.lime{color:#d8ed98}.headline{color:#f4f6ee;font-size:38px;line-height:1.08;font-weight:600;margin:0}.card{background:#f7f8f2;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px}.eyebrow{color:#6b8251;font-size:11px;font-weight:700;letter-spacing:1.5px}.title{font-size:27px;font-weight:600;margin:0}.caption{color:#71806f;font-size:14px;line-height:1.5;margin:0}.availability{color:#416647;font-weight:600}.total{font-size:26px;font-weight:700}.button{border:0;background:#19382c;color:#fff;padding:16px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}.button.alt{background:#e7eee2;color:#19382c}.links{display:flex;justify-content:space-between}.link{border:0;background:none;color:#53704e;font-weight:600;cursor:pointer;padding:4px}.progress{display:flex;gap:5px}.progress i{height:4px;flex:1;border-radius:4px;background:#dbe3d8}.progress i.on{background:#d8ed98}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe3d8;padding:12px 0}.badge{font-size:12px;color:#416647;background:#e4efdc;border-radius:99px;padding:6px 9px}.notice{padding:12px;border-radius:10px;background:#fff1d6;color:#845d20;font-size:13px}</style></head><body><main class="phone"><div class="brand">batyeo<span class="dot">.</span></div><h1 class="headline">Votre énergie,<br><span class="lime">avec vous.</span></h1><div id="app"><section class="card"><p class="caption">Une batterie quand vous en avez besoin.</p><button class="button" onclick="nav('scan')">Scanner un QR code</button><div class="links"><button class="link" onclick="nav('history')">Historique</button><button class="link" onclick="nav('support')">Assistance</button><button class="link" onclick="nav('settings')">Réglages</button></div><p class="caption">Mode DEMO · aucune transaction réelle</p></section></div></main><script>const app=document.getElementById('app');let screen='home';const station={name:'Hôtel Démo Paris',city:'Paris',available:6};const money=n=>(n/100).toFixed(2).replace('.',',')+' €';function nav(s){screen=s;render()}function render(){let c='';if(screen==='home')c=`<section class="card"><p class="caption">Une batterie quand vous en avez besoin.</p><button class="button" onclick="nav('scan')">Scanner un QR code</button><div class="links"><button class="link" onclick="nav('history')">Historique</button><button class="link" onclick="nav('support')">Assistance</button><button class="link" onclick="nav('settings')">Réglages</button></div><p class="caption">Mode DEMO · aucune transaction réelle</p></section>`;if(screen==='scan')c=`<section class="card"><div class="progress"><i class="on"></i><i></i><i></i></div><p class="eyebrow">SCAN QR · DEMO</p><h2 class="title">Station BATYEO détectée</h2><p class="caption">QR simulé validé côté Core.</p><div class="row"><span>${station.name}</span><span class="badge">EN LIGNE</span></div><button class="button" onclick="nav('station')">Voir la station</button><button class="button alt" onclick="nav('home')">Annuler</button></section>`;if(screen==='station')c=`<section class="card"><div class="progress"><i class="on"></i><i class="on"></i><i></i></div><p class="eyebrow">STATION</p><h2 class="title">${station.name}</h2><p class="caption">${station.city} · Station BATYEO Demo</p><p class="availability">● ${station.available} batteries disponibles</p><p class="caption"><b>2 €</b> / heure commencée · maximum 8 €<br>Caution temporaire 20 € · retour sous 48 h</p><p class="caption">CGV BATYEO acceptées (démo).</p><button class="button" onclick="nav('pay')">Prendre une batterie</button></section>`;if(screen==='pay')c=`<section class="card"><div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i></div><p class="eyebrow">AUTORISATION</p><h2 class="title">Caution temporaire</h2><p class="caption">Autorisation mock de <b>20,00 €</b>. Aucun débit réel.</p><button class="button" onclick="nav('eject')">Autoriser et continuer</button><button class="button alt" onclick="nav('station')">Retour</button></section>`;if(screen==='eject')c=`<section class="card"><p class="eyebrow">PRÉPARATION</p><h2 class="title">Batterie en cours d’éjection…</h2><p class="caption">La station simulée prépare votre batterie.</p><div class="notice">Mode DEMO · action hardware non exécutée</div><button class="button" onclick="nav('active')">Afficher la location active</button></section>`;if(screen==='active')c=`<section class="card"><p class="eyebrow">LOCATION ACTIVE</p><h2 class="title">${station.name}</h2><p class="availability">● Batterie en cours d’utilisation</p><p class="caption">Durée : 1 min</p><p class="total">${money(200)} <span class="caption">· plafond ${money(800)}</span></p><p class="caption">Retour sous 48 h</p><button class="button" onclick="nav('return')">Trouver une station pour la rendre</button></section>`;if(screen==='return')c=`<section class="card"><p class="eyebrow">RETOUR</p><h2 class="title">Choisir une station</h2><div class="row"><span>${station.name}</span><span class="badge">2 slots libres</span></div><p class="caption">Disponibilité confirmée par BATYEO Core.</p><button class="button" onclick="nav('complete')">Simuler le retour ici</button></section>`;if(screen==='complete')c=`<section class="card"><p class="eyebrow">BATTERIE RENDUE</p><h2 class="title">Merci, à bientôt.</h2><p class="caption">Référence BAT-DEMO-001</p><p class="total">${money(200)}</p><p class="caption">Caution libérée : ${money(1800)}</p><button class="button" onclick="nav('history')">Voir l’historique</button><button class="button alt" onclick="nav('home')">Retour à l’accueil</button></section>`;if(screen==='history')c=`<section class="card"><p class="eyebrow">HISTORIQUE</p><h2 class="title">Vos locations</h2><div class="row"><span><b>Hôtel Démo Paris</b><br><span class="caption">Aujourd’hui · 1 min</span></span><span class="badge">2,00 €</span></div><button class="button alt" onclick="nav('home')">Accueil</button></section>`;if(screen==='support')c=`<section class="card"><p class="eyebrow">ASSISTANCE</p><h2 class="title">Un problème ?</h2><p class="caption">Ticket lié à la location (mock).</p><textarea placeholder="Décrivez le problème" style="min-height:100px;padding:13px;border:1px solid #d5dfd3;border-radius:10px;font:inherit"></textarea><button class="button" onclick="alert('Ticket support mock créé')">Envoyer le ticket</button><button class="button alt" onclick="nav('home')">Retour</button></section>`;if(screen==='settings')c=`<section class="card"><p class="eyebrow">RÉGLAGES</p><h2 class="title">BATYEO mobile</h2><p class="caption">Session locale protégée · notifications no-op sans credentials.</p><button class="button alt" onclick="nav('home')">Retour</button></section>`;app.innerHTML=c}render();</script></body></html>
