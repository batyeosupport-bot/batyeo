name: BATYEO integrity
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: batyeo
          POSTGRES_PASSWORD: batyeo_test_only
          POSTGRES_DB: batyeo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U batyeo -d batyeo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://batyeo:batyeo_test_only@localhost:5432/batyeo_test
      BATYEO_TEST_DATABASE_URL: postgresql://batyeo:batyeo_test_only@localhost:5432/batyeo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:postgres
      - run: pnpm build
      - run: pnpm test:integration
